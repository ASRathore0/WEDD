name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production_deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: 📦 Build Frontend (Vite + React)
        run: |
          cd frontend
          npm ci || npm install
          npm run build

      - name: ⚙️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, fileinfo
          coverage: none

      - name: 📦 Install Backend Dependencies (Composer)
        run: |
          cd backend
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: 🏗️ Package Unified Deployment Payload
        run: |
          # Copy compiled frontend into backend/public
          mkdir -p backend/public
          cp -rf frontend/dist/* backend/public/

          # Prepare clean deployment staging payload
          mkdir -p deploy_payload
          cp -rf backend/* deploy_payload/
          cp -f backend/.htaccess deploy_payload/.htaccess 2>/dev/null || true
          cp -f backend/.env.production.hostinger deploy_payload/.env.production.hostinger 2>/dev/null || true

          # Create high-speed deployment archive
          tar -czf release.tar.gz -C deploy_payload .

      - name: 🚀 Upload Release Archive to Hostinger (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          source: "release.tar.gz"
          target: ${{ secrets.HOSTINGER_REMOTE_PATH }}

      - name: ⚡ Extract Release & Optimize on Hostinger (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          script: |
            cd ${{ secrets.HOSTINGER_REMOTE_PATH }}

            # Extract release archive without overwriting live .env or uploaded media
            tar -xzf release.tar.gz --exclude='.env' --overwrite
            rm -f release.tar.gz

            # If .env does not exist on server, copy the prepared hostinger template
            if [ ! -f .env ] && [ -f .env.production.hostinger ]; then
              cp .env.production.hostinger .env
            fi

            # Ensure storage and bootstrap/cache permissions
            chmod -R 775 storage bootstrap/cache 2>/dev/null || true
            chmod -R 777 storage bootstrap/cache 2>/dev/null || true

            # Optimize and link storage
            php artisan storage:link 2>/dev/null || true
            php artisan migrate --force 2>/dev/null || true
            php artisan config:clear 2>/dev/null || true
            php artisan route:clear 2>/dev/null || true
            php artisan view:clear 2>/dev/null || true
